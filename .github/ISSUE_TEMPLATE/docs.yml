name: Documentation fix
description: Something in the docs is wrong, unclear or missing
title: "Docs: "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The address of the page (the website's "Suggest an edit" link fills this in).
      placeholder: https://.../docs/quickstart
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong, unclear or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What should it say instead?
      description: Optional. A corrected sentence or code sample is the most useful thing you can give us.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tbdname
          POSTGRES_PASSWORD: tbdname
          POSTGRES_DB: tbdname_test
          # Non-UTC on purpose: catches timestamps written in the session timezone.
          TZ: Asia/Kolkata
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tbdname" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL_TEST: postgresql://tbdname:tbdname@localhost:5432/tbdname_test
      REDIS_URL_TEST: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Migrate test database
        working-directory: apps/server
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}
      - run: npm test
      - name: Accuracy harness (fails on regression against baseline)
        run: npm run accuracy

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/server/Dockerfile -t tbdname-server:ci .
      - run: docker build -f apps/dashboard/Dockerfile -t tbdname-dashboard:ci .

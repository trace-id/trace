version: 2

# Minor and patch updates arrive as one grouped pull request per ecosystem each week. Major versions are never opened
# automatically: they change behaviour (a new NestJS, ESLint or Node major is a project, not a bump), so upgrade them
# deliberately and run the accuracy check and the full test suite.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /apps/server
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
